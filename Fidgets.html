<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fidget World</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f4f4;
}

header{
    background:#6c5ce7;
    color:white;
    padding:20px;
    text-align:center;
}

nav{
    background:#4b3fcf;
    padding:10px;
    text-align:center;
}

nav a{
    color:white;
    margin:0 15px;
    text-decoration:none;
    font-weight:bold;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
}

.product{
    background:white;
    border-radius:10px;
    padding:15px;
    margin:15px;
    width:220px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.product img{
    width:100%;
    border-radius:8px;
}

.price{
    font-size:18px;
    color:#333;
    margin:10px 0;
}

button{
    background:#6c5ce7;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#4b3fcf;
}

footer{
    text-align:center;
    padding:15px;
    background:#333;
    color:white;
}

</style>
</head>

<body>

<header>
<h1>Fidget World</h1>
<p>The Best Fidget Toys Online</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">Contact</a>
</nav>

<section class="products">

<div class="product">
<img src="https://via.placeholder.com/200" alt="Fidget Spinner">
<h3>Fidget Spinner</h3>
<p class="price">£4.99</p>
<button>Buy Now</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/200" alt="Pop It">
<h3>Rainbow Pop It</h3>
<p class="price">£6.99</p>
<button>Buy Now</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/200" alt="Simple Dimple">
<h3>Simple Dimple</h3>
<p class="price">£3.99</p>
<button>Buy Now</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/200" alt="Infinity Cube">
<h3>Infinity Cube</h3>
<p class="price">£5.49</p>
<button>Buy Now</button>
</div>

</section>

<footer>
<p>© 2026 Fidget World | All rights reserved</p>
</footer>

</body>
</html>
